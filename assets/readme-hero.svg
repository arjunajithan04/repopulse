    <circle cx="24" cy="27" r="5" fill="#a78bfa"/>
    <text x="39" y="23" fill="#e9e7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">WHAT → WHY → NOW WHAT</text>
